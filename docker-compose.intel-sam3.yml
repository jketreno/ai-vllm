name: ai-vllm-intel-sam3

services:
  sam3-worker:
    profiles: [sam3]
    build:
      context: .
      dockerfile: sam3/Dockerfile.intel
    restart: unless-stopped
    ipc: host
    devices:
      - ${SAM3_INTEL_DEVICE:-/dev/dri/renderD128}:${SAM3_INTEL_DEVICE:-/dev/dri/renderD128}
    group_add:
      - ${SAM3_INTEL_DEVICE_GID:-992}
    environment:
      HF_TOKEN_FILE: /run/secrets/huggingface_token
      LOG_LEVEL: ${SAM3_LOG_LEVEL:-INFO}
      SAM3_PLATFORM: intel_arc
      SAM3_RESOLUTION: ${SAM3_INTEL_RESOLUTION:-1008}
    secrets:
      - huggingface_token
    volumes:
      - ${SAM3_MODEL_CACHE:-./models/huggingface}:/root/.cache/huggingface
    ports:
      - "${SAM3_BIND_ADDRESS:-127.0.0.1}:${SAM3_API_PORT:-8004}:8004"
      - "${SAM3_METRICS_BIND_ADDRESS:-127.0.0.1}:${SAM3_METRICS_PORT:-9092}:9092"
    healthcheck:
      # start_period only needs to cover model load, not steady-state
      # serving -- a warm cache (the common case; ./models/huggingface
      # persists across restarts) loads in single-digit seconds, so 120s
      # leaves generous headroom while still letting a post-ready failure
      # (e.g. an XPU OOM on the first real request) count toward
      # unhealthy/autoheal within a couple minutes instead of being masked
      # for a full 10 minutes. start_interval probes every 5s until the
      # first success so a warm start doesn't wait out a full 30s interval
      # to be marked ready.
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
    labels:
      - "autoheal=true"

  # sam3-worker's healthcheck correctly reports unhealthy after a fatal
  # device error (e.g. XPU OOM/DEVICE_LOST -- see /health/ready's
  # last_inference_error), but `restart: unless-stopped` alone never acts on
  # that: Docker only restarts a container on process exit, not on a failing
  # healthcheck. Without this, an OOM'd worker sits unhealthy indefinitely
  # until someone notices and restarts it by hand.
  autoheal:
    profiles: [sam3]
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

secrets:
  huggingface_token:
    file: ./secrets/huggingface_token
